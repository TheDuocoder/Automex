services:
  mysql:
    image: mysql:8.0
    container_name: automex_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: automex
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - automex_network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: automex_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://root:root@mysql:3306/automex
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./Backend:/app
    networks:
      - automex_network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: automex_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    networks:
      - automex_network

  nginx:
    image: nginx:alpine
    container_name: automex_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - automex_network

volumes:
  mysql_data:
    driver: local

networks:
  automex_network:
    driver: bridge

