<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Category Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            padding: 20px;
        }

        .slider-container {
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px 64px;
            overflow: hidden;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f1f5f9;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .nav-arrow:hover {
            background: #e2e8f0;
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .nav-arrow:focus {
            outline: 2px solid #ef4444;
            outline-offset: 2px;
        }

        .nav-arrow.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .nav-arrow svg {
            width: 20px;
            height: 20px;
            color: #64748b;
        }

        .nav-prev {
            left: 16px;
        }

        .nav-next {
            right: 16px;
        }

        .slider-wrapper {
            overflow: hidden;
            position: relative;
        }

        .slider-track {
            display: flex;
            transition: transform 0.3s ease;
            gap: 24px;
        }

        .category-card {
            flex: 0 0 auto;
            min-width: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 2px solid transparent;
        }

        .category-card:hover {
            background: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .category-card:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .category-card.active {
            background: #fef5f5;
            border-color: #fecaca;
            transform: translateY(-2px);
        }

        .category-card.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 4px;
            background: #ef4444;
            border-radius: 2px 2px 0 0;
        }

        .icon-container {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border-radius: 8px;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        .category-card:hover .icon-container {
            background: #e2e8f0;
            transform: scale(1.05);
        }

        .category-card.active .icon-container {
            background: #fee2e2;
            transform: scale(1.1);
        }

        .icon-container img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .category-label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            line-height: 1.2;
            transition: all 0.3s ease;
        }

        .category-card.active .category-label {
            color: #1e293b;
            font-weight: 700;
        }

        .category-card:hover .category-label {
            color: #1e293b;
        }

        /* Responsive breakpoints */
        @media (max-width: 1024px) {
            .slider-container {
                padding: 20px 56px;
            }
            
            .category-card {
                min-width: 150px;
                padding: 16px 8px;
            }
            
            .slider-track {
                gap: 16px;
            }
        }

        @media (max-width: 768px) {
            .slider-container {
                padding: 16px 48px;
                margin: 0 16px;
            }
            
            .nav-arrow {
                width: 40px;
                height: 40px;
            }
            
            .nav-arrow svg {
                width: 16px;
                height: 16px;
            }
            
            .nav-prev {
                left: 8px;
            }
            
            .nav-next {
                right: 8px;
            }
            
            .category-card {
                min-width: 130px;
                padding: 12px 6px;
            }
            
            .slider-track {
                gap: 12px;
            }
            
            .icon-container {
                width: 48px;
                height: 48px;
                margin-bottom: 8px;
            }
            
            .icon-container img {
                width: 32px;
                height: 32px;
            }
            
            .category-label {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .slider-container {
                padding: 12px 40px;
                margin: 0 8px;
            }
            
            .category-card {
                min-width: 110px;
                padding: 10px 4px;
            }
            
            .slider-track {
                gap: 8px;
            }
            
            .icon-container {
                width: 40px;
                height: 40px;
                margin-bottom: 6px;
            }
            
            .icon-container img {
                width: 28px;
                height: 28px;
            }
            
            .category-label {
                font-size: 10px;
            }
        }

        /* Focus and accessibility */
        .category-card:focus-visible {
            outline: 2px solid #ef4444;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .slider-track,
            .category-card,
            .nav-arrow,
            .icon-container {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="slider-container">
        <button class="nav-arrow nav-prev" id="prevBtn" aria-label="Previous categories">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15,18 9,12 15,6"></polyline>
            </svg>
        </button>
        
        <button class="nav-arrow nav-next" id="nextBtn" aria-label="Next categories">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9,18 15,12 9,6"></polyline>
            </svg>
        </button>
        
        <div class="slider-wrapper">
            <div class="slider-track" id="sliderTrack">
                <div class="category-card active" tabindex="0" data-category="car-services">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/4f46e5/ffffff?text=🚗" alt="Car Services">
                    </div>
                    <div class="category-label">Car Services</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="ac-services">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/06b6d4/ffffff?text=❄️" alt="AC Services">
                    </div>
                    <div class="category-label">AC Service & Repair</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="batteries">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/f59e0b/ffffff?text=🔋" alt="Batteries">
                    </div>
                    <div class="category-label">Batteries</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="tyres">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/10b981/ffffff?text=🛞" alt="Tyres">
                    </div>
                    <div class="category-label">Tyres & Wheel Care</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="denting">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/8b5cf6/ffffff?text=🔨" alt="Denting">
                    </div>
                    <div class="category-label">Denting & Painting</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="detailing">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/ef4444/ffffff?text=✨" alt="Detailing">
                    </div>
                    <div class="category-label">Detailing Services</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="suspension">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/f97316/ffffff?text=⚙️" alt="Suspension">
                    </div>
                    <div class="category-label">Suspension & Fitting</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="spa">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/06b6d4/ffffff?text=🧽" alt="Spa">
                    </div>
                    <div class="category-label">Spa & Cleaning</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="clutch">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/84cc16/ffffff?text=⚙️" alt="Clutch">
                    </div>
                    <div class="category-label">Clutch & Body Parts</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="windshield">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/3b82f6/ffffff?text=🪟" alt="Windshield">
                    </div>
                    <div class="category-label">Windshield & Lights</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="inspections">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/ec4899/ffffff?text=🔍" alt="Inspections">
                    </div>
                    <div class="category-label">Car Inspections</div>
                </div>
                
                <div class="category-card" tabindex="0" data-category="insurance">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/40x40/14b8a6/ffffff?text=🛡️" alt="Insurance">
                    </div>
                    <div class="category-label">Car Insurance</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sliderTrack = document.getElementById('sliderTrack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const cards = document.querySelectorAll('.category-card');
        
        let currentIndex = 0;
        const visibleCards = 6;
        const totalCards = cards.length;
        
        function updateSlider() {
            const cardWidth = cards[0].offsetWidth;
            const gap = 24; // Gap between cards
            const translateX = -(currentIndex * (cardWidth + gap));
            sliderTrack.style.transform = `translateX(${translateX}px)`;
            
            // Update navigation buttons
            prevBtn.classList.toggle('disabled', currentIndex === 0);
            nextBtn.classList.toggle('disabled', currentIndex >= totalCards - visibleCards);
        }
        
        function goToPrevious() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        }
        
        function goToNext() {
            if (currentIndex < totalCards - visibleCards) {
                currentIndex++;
                updateSlider();
            }
        }
        
        // Event listeners
        prevBtn.addEventListener('click', goToPrevious);
        nextBtn.addEventListener('click', goToNext);
        
        // Card click handlers
        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Remove active class from all cards
                cards.forEach(c => c.classList.remove('active'));
                // Add active class to clicked card
                card.classList.add('active');
            });
            
            // Keyboard navigation
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    card.click();
                }
            });
        });
        
        // Keyboard navigation for slider
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                goToPrevious();
            } else if (e.key === 'ArrowRight') {
                goToNext();
            }
        });
        
        // Responsive updates
        function handleResize() {
            updateSlider();
        }
        
        window.addEventListener('resize', handleResize);
        
        // Initialize
        updateSlider();
        
        // Auto-adjust visible cards based on screen size
        function updateVisibleCards() {
            const containerWidth = document.querySelector('.slider-container').offsetWidth;
            const cardWidth = cards[0].offsetWidth;
            const gap = 24;
            const availableWidth = containerWidth - 128; // Account for padding and arrows
            const newVisibleCards = Math.floor(availableWidth / (cardWidth + gap));
            
            // Update navigation logic if needed
            nextBtn.classList.toggle('disabled', currentIndex >= totalCards - Math.max(newVisibleCards, 1));
        }
        
        window.addEventListener('resize', updateVisibleCards);
        updateVisibleCards();
    </script>
</body>
</html>
