<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Storage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5568d3;
        }
        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            text-align: left;
        }
        .info p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear Browser Storage</h1>
        <p>This will stop automatic API calls from the frontend</p>
        
        <div class="info">
            <p><strong>What this does:</strong></p>
            <p>✓ Clears all localStorage data</p>
            <p>✓ Removes auth tokens</p>
            <p>✓ Stops repeated API calls</p>
            <p>✓ Resets the frontend state</p>
        </div>

        <button class="btn" onclick="clearStorage()">Clear Storage</button>
        <button class="btn btn-danger" onclick="clearAndRefresh()">Clear & Refresh Page</button>
        
        <div class="success" id="success">
            ✅ Storage cleared successfully!
        </div>
    </div>

    <script>
        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('success').style.display = 'block';
            console.log('✅ Storage cleared!');
        }

        function clearAndRefresh() {
            clearStorage();
            setTimeout(() => {
                window.location.reload();
            }, 500);
        }
    </script>
</body>
</html>
