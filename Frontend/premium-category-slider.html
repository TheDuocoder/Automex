<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMex - Premium Category Slider</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Global Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            padding: 40px 20px;
            line-height: 1.5;
        }

        /* Slider Container */
        .slider-container {
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.08);
            padding: 32px 80px;
            overflow: hidden;
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #F4F6F8;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        .nav-arrow:hover {
            background: #ECEFF3;
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .nav-arrow:focus {
            outline: 2px solid #E74A3B;
            outline-offset: 2px;
        }

        .nav-arrow:active {
            transform: translateY(-50%) scale(0.98);
        }

        .nav-arrow.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .nav-arrow svg {
            width: 20px;
            height: 20px;
            color: #64748b;
            transition: color 0.2s ease;
        }

        .nav-arrow:hover svg {
            color: #475569;
        }

        .nav-prev {
            left: 20px;
        }

        .nav-next {
            right: 20px;
        }

        /* Slider Wrapper */
        .slider-wrapper {
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .slider-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            gap: 20px;
            will-change: transform;
        }

        /* Category Card */
        .category-card {
            flex: 0 0 auto;
            min-width: 180px;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 10px;
            border-radius: 16px;
            background: #FFFFFF;
            border: 1px solid #F0F2F5;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            gap: 10px;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            border-color: #E2E8F0;
        }

        .category-card:focus {
            outline: none;
            border-color: #E74A3B;
            box-shadow: 0 0 0 3px rgba(231, 74, 59, 0.1);
        }

        .category-card:focus:not(:focus-visible) {
            outline: none;
            box-shadow: none;
            border-color: #F0F2F5;
        }

        .category-card:focus-visible {
            outline: 2px solid #E74A3B;
            outline-offset: 2px;
        }

        .category-card.active {
            background: #FFF5F5;
            border-color: #FECACA;
            transform: translateY(-5px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        /* Active Card Indicator */
        .category-card.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 4px;
            background: #E74A3B;
            border-radius: 2px 2px 0 0;
        }

        /* Icon Container */
        .icon-container {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-container img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .category-card:hover .icon-container img {
            transform: scale(1.05);
        }

        .category-card.active .icon-container img {
            transform: scale(1.08);
        }

        /* Category Label */
        .category-label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #263238;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            line-height: 1.2;
            transition: color 0.3s ease;
        }

        .category-card:hover .category-label {
            color: #1a202c;
        }

        .category-card.active .category-label {
            color: #1a202c;
            font-weight: 700;
        }

        /* Responsive Design - Tablet */
        @media (max-width: 1024px) {
            .slider-container {
                padding: 28px 64px;
            }
            
            .category-card {
                min-width: 160px;
                height: 100px;
                padding: 10px 8px;
                gap: 8px;
            }
            
            .slider-track {
                gap: 16px;
            }

            .icon-container {
                width: 48px;
                height: 48px;
            }

            .icon-container img {
                width: 48px;
                height: 48px;
            }

            .category-label {
                font-size: 13px;
            }
        }

        /* Responsive Design - Mobile */
        @media (max-width: 768px) {
            .slider-container {
                padding: 24px 56px;
                margin: 0 16px;
            }
            
            .nav-arrow {
                width: 40px;
                height: 40px;
            }
            
            .nav-arrow svg {
                width: 16px;
                height: 16px;
            }
            
            .nav-prev {
                left: 12px;
            }
            
            .nav-next {
                right: 12px;
            }
            
            .category-card {
                min-width: 140px;
                height: 90px;
                padding: 8px 6px;
                gap: 6px;
            }
            
            .slider-track {
                gap: 12px;
            }

            .icon-container {
                width: 44px;
                height: 44px;
            }

            .icon-container img {
                width: 44px;
                height: 44px;
            }
            
            .category-label {
                font-size: 12px;
            }
        }

        /* Responsive Design - Small Mobile */
        @media (max-width: 480px) {
            .slider-container {
                padding: 20px 48px;
                margin: 0 12px;
            }
            
            .category-card {
                min-width: 120px;
                height: 80px;
                padding: 6px 4px;
                gap: 4px;
            }
            
            .slider-track {
                gap: 8px;
            }

            .icon-container {
                width: 40px;
                height: 40px;
            }

            .icon-container img {
                width: 40px;
                height: 40px;
            }
            
            .category-label {
                font-size: 11px;
            }
        }

        /* Accessibility and Motion */
        @media (prefers-reduced-motion: reduce) {
            .slider-track,
            .category-card,
            .nav-arrow,
            .icon-container img {
                transition: none;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .category-card {
                border-width: 2px;
            }
            
            .category-card.active {
                border-color: #000000;
            }
        }

        /* Focus indicators for keyboard users only */
        .js-focus-visible .category-card:focus:not(.focus-visible) {
            outline: none;
            box-shadow: none;
            border-color: #F0F2F5;
        }
    </style>
</head>
<body>
    <div class="slider-container">
        <!-- Left Navigation Arrow -->
        <button class="nav-arrow nav-prev" id="prevBtn" aria-label="Previous categories" tabindex="0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15,18 9,12 15,6"></polyline>
            </svg>
        </button>
        
        <!-- Right Navigation Arrow -->
        <button class="nav-arrow nav-next" id="nextBtn" aria-label="Next categories" tabindex="0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9,18 15,12 9,6"></polyline>
            </svg>
        </button>
        
        <!-- Slider Content -->
        <div class="slider-wrapper">
            <div class="slider-track" id="sliderTrack">
                
                <!-- Car Services -->
                <div class="category-card active" tabindex="0" data-category="car-services" aria-label="Car Services category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/4f46e5/ffffff?text=🚗" alt="Car Services Icon">
                    </div>
                    <div class="category-label">Car Services</div>
                </div>
                
                <!-- AC Service & Repair -->
                <div class="category-card" tabindex="0" data-category="ac-services" aria-label="AC Service and Repair category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/06b6d4/ffffff?text=❄️" alt="AC Services Icon">
                    </div>
                    <div class="category-label">AC Service & Repair</div>
                </div>
                
                <!-- Batteries -->
                <div class="category-card" tabindex="0" data-category="batteries" aria-label="Batteries category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/f59e0b/ffffff?text=🔋" alt="Batteries Icon">
                    </div>
                    <div class="category-label">Batteries</div>
                </div>
                
                <!-- Tyres & Wheel Care -->
                <div class="category-card" tabindex="0" data-category="tyres" aria-label="Tyres and Wheel Care category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/10b981/ffffff?text=🛞" alt="Tyres Icon">
                    </div>
                    <div class="category-label">Tyres & Wheel Care</div>
                </div>
                
                <!-- Denting & Painting -->
                <div class="category-card" tabindex="0" data-category="denting" aria-label="Denting and Painting category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/8b5cf6/ffffff?text=🔨" alt="Denting Icon">
                    </div>
                    <div class="category-label">Denting & Painting</div>
                </div>
                
                <!-- Detailing Services -->
                <div class="category-card" tabindex="0" data-category="detailing" aria-label="Detailing Services category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/ef4444/ffffff?text=✨" alt="Detailing Icon">
                    </div>
                    <div class="category-label">Detailing Services</div>
                </div>
                
                <!-- Suspension and Fitting -->
                <div class="category-card" tabindex="0" data-category="suspension" aria-label="Suspension and Fitting category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/f97316/ffffff?text=⚙️" alt="Suspension Icon">
                    </div>
                    <div class="category-label">Suspension and Fitting</div>
                </div>
                
                <!-- Spa and Cleaning -->
                <div class="category-card" tabindex="0" data-category="spa" aria-label="Spa and Cleaning category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/06b6d4/ffffff?text=🧽" alt="Spa Icon">
                    </div>
                    <div class="category-label">Spa and Cleaning</div>
                </div>
                
                <!-- Clutch and Body Parts -->
                <div class="category-card" tabindex="0" data-category="clutch" aria-label="Clutch and Body Parts category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/84cc16/ffffff?text=⚙️" alt="Clutch Icon">
                    </div>
                    <div class="category-label">Clutch and Body Parts</div>
                </div>
                
                <!-- Windshield and Lights -->
                <div class="category-card" tabindex="0" data-category="windshield" aria-label="Windshield and Lights category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/3b82f6/ffffff?text=🪟" alt="Windshield Icon">
                    </div>
                    <div class="category-label">Windshield and Lights</div>
                </div>
                
                <!-- Inspection -->
                <div class="category-card" tabindex="0" data-category="inspection" aria-label="Inspection category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/ec4899/ffffff?text=🔍" alt="Inspection Icon">
                    </div>
                    <div class="category-label">Inspection</div>
                </div>
                
                <!-- Insurance -->
                <div class="category-card" tabindex="0" data-category="insurance" aria-label="Insurance category">
                    <div class="icon-container">
                        <img src="https://via.placeholder.com/52x52/14b8a6/ffffff?text=🛡️" alt="Insurance Icon">
                    </div>
                    <div class="category-label">Insurance</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Slider functionality
        const sliderTrack = document.getElementById('sliderTrack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const cards = document.querySelectorAll('.category-card');
        
        let currentIndex = 0;
        let visibleCards = 6; // Default for desktop
        const totalCards = cards.length;
        
        // Update visible cards based on screen size
        function updateVisibleCards() {
            const screenWidth = window.innerWidth;
            if (screenWidth <= 480) {
                visibleCards = 2;
            } else if (screenWidth <= 768) {
                visibleCards = 3;
            } else if (screenWidth <= 1024) {
                visibleCards = 4;
            } else {
                visibleCards = 6;
            }
        }
        
        // Update slider position and navigation buttons
        function updateSlider() {
            const cardElement = cards[0];
            const cardWidth = cardElement.offsetWidth;
            const cardStyle = window.getComputedStyle(cardElement);
            const gap = parseInt(window.getComputedStyle(sliderTrack).gap) || 20;
            
            const translateX = -(currentIndex * (cardWidth + gap));
            sliderTrack.style.transform = `translateX(${translateX}px)`;
            
            // Update navigation button states
            prevBtn.classList.toggle('disabled', currentIndex === 0);
            nextBtn.classList.toggle('disabled', currentIndex >= totalCards - visibleCards);
        }
        
        // Navigate to previous set of cards
        function goToPrevious() {
            if (currentIndex > 0) {
                currentIndex = Math.max(0, currentIndex - 1);
                updateSlider();
            }
        }
        
        // Navigate to next set of cards
        function goToNext() {
            const maxIndex = Math.max(0, totalCards - visibleCards);
            if (currentIndex < maxIndex) {
                currentIndex = Math.min(maxIndex, currentIndex + 1);
                updateSlider();
            }
        }
        
        // Set active card
        function setActiveCard(targetCard) {
            cards.forEach(card => card.classList.remove('active'));
            targetCard.classList.add('active');
        }
        
        // Event listeners for navigation arrows
        prevBtn.addEventListener('click', goToPrevious);
        nextBtn.addEventListener('click', goToNext);
        
        // Event listeners for category cards
        cards.forEach(card => {
            // Click handler
            card.addEventListener('click', () => {
                setActiveCard(card);
            });
            
            // Keyboard navigation
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    setActiveCard(card);
                }
                
                // Arrow key navigation between cards
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    const nextCard = card.nextElementSibling;
                    if (nextCard && nextCard.classList.contains('category-card')) {
                        nextCard.focus();
                    }
                }
                
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    const prevCard = card.previousElementSibling;
                    if (prevCard && prevCard.classList.contains('category-card')) {
                        prevCard.focus();
                    }
                }
            });
        });
        
        // Global keyboard navigation for slider
        document.addEventListener('keydown', (e) => {
            // Only handle if no specific element is focused
            if (document.activeElement === document.body) {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToPrevious();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToNext();
                }
            }
        });
        
        // Touch/swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        sliderTrack.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        sliderTrack.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const swipeDistance = touchStartX - touchEndX;
            
            if (Math.abs(swipeDistance) > swipeThreshold) {
                if (swipeDistance > 0) {
                    goToNext(); // Swipe left, go to next
                } else {
                    goToPrevious(); // Swipe right, go to previous
                }
            }
        }
        
        // Handle window resize
        function handleResize() {
            updateVisibleCards();
            // Reset to first page if current position is invalid
            const maxIndex = Math.max(0, totalCards - visibleCards);
            if (currentIndex > maxIndex) {
                currentIndex = maxIndex;
            }
            updateSlider();
        }
        
        window.addEventListener('resize', debounce(handleResize, 250));
        
        // Debounce function for resize events
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        // Initialize slider
        updateVisibleCards();
        updateSlider();
        
        // Focus management for accessibility
        let focusVisible = false;
        
        // Detect if user is using keyboard navigation
        document.addEventListener('keydown', () => {
            focusVisible = true;
            document.body.classList.add('js-focus-visible');
        });
        
        document.addEventListener('mousedown', () => {
            focusVisible = false;
            document.body.classList.remove('js-focus-visible');
        });
    </script>
</body>
</html>
